# /etc/nginx/sites-available/rutapaq  (enlazar en sites-enabled y recargar nginx)
# Nginx es lo único expuesto (80/443); RUTAPAQ escucha en 127.0.0.1:8080.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE: sin buffer y con la conexión abierta
    location /api/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
# Con dominio, agregar HTTPS (443) con:  sudo certbot --nginx -d su-dominio
