# ---------------------------------------------------------------------------
# RUTAPAQ - configuración (un solo lugar para los parámetros editables).
#
# Este archivo va junto al .jar y es el que se edita: aquí están el servidor, los escenarios, el mapa,
# los almacenes, la flota por tipo, las averías, el mantenimiento y el semáforo. La pantalla Configuración
# (menú izquierdo) guarda sus cambios en este mismo archivo.
# Los valores de fábrica vienen dentro del .jar (planner.properties y una copia de este archivo) y son los que
# usa "Restaurar valores por defecto". planner.properties además tiene los parámetros de los algoritmos
# (Sc, P, ALNS, GA): para cambiar uno sin recompilar, agregue aquí la misma clave; este archivo tiene prioridad.
# ---------------------------------------------------------------------------

# Servidor (en la VM de AWS usar 127.0.0.1: solo Nginx expone el sistema)
servidor.host=0.0.0.0
servidor.puerto=8080

# Carpeta con ventas.aaaamm.txt, bloqueo.aamm.txt y mant.preventivo.*.txt
datos.carpeta=datos

# Algoritmo de rutapaq-planner: ALNS (ALNS_PAQRAP) o GA (HGS_PAQRAP)
planificador.algoritmo=ALNS
# Holgura opcional: el planificador ve cada límite N minutos antes (0 = igual que en el IEN)
planificador.margenMinutos=0
# S13v1 (G07): los bloqueos son planificados con antelación (P&R 7), así que cada plan considera los vigentes y
# además los que empiezan dentro de estas horas; las unidades evitan esas calles. 0 = solo los vigentes (como antes).
# Si con los futuros algún destino quedara sin camino, ese plan usa solo los vigentes.
planificador.anticipacionBloqueosHoras=1
# Sc y P se configuran en planner.properties: ien.scMinutos y planificador.presupuestoSegundos

# ---------------------------------------------------------------------------
# v0.5: parámetros del caso que se editan desde la pantalla Configuración (menú izquierdo). La pantalla guarda
# sus cambios en este mismo archivo. Los valores de fábrica están en planner.properties (dentro del .jar).
# ---------------------------------------------------------------------------

# Mapa de la ciudad (B01; P&R 4): retícula con calles cada 1 km, origen (0,0) abajo a la izquierda.
# Largo en el eje X y ancho en el eje Y, en km. Se aplica al iniciar la próxima simulación; el visualizador
# dibuja el mapa con estos valores. Los pedidos y bloqueos que queden fuera del mapa se ignoran.
ien.mapaAnchoKm=70
ien.mapaAltoKm=50

# Almacenes (B02): ubicación x,y en km dentro del mapa, y capacidad de cada intermedio.
# Se aplican al iniciar la próxima simulación.
ien.almacenCentral=27,14
ien.almacenNorOeste=12,38
ien.almacenEste=57,27
ien.capacidadIntermedio=1000

# Flota por tipo (B04): cantidad, capacidad (paquetes), velocidad (km/h) y costo (S/ por km).
# Cantidad, capacidad y costo se aplican al iniciar la próxima simulación (P&R 9); la velocidad, en el siguiente
# ciclo de planificación de la simulación en curso (P&R 15 y 16).
ien.autos=10
flota.auto.capacidad=24
flota.auto.velocidadKmh=40
flota.auto.costoKm=8
ien.motos=15
flota.moto.capacidad=8
flota.moto.velocidadKmh=25
flota.moto.costoKm=6
ien.bicicletas=12
flota.bici.capacidad=4
flota.bici.velocidadKmh=12
flota.bici.costoKm=3

# Escenarios (fecha y hora que propone la pantalla al abrirla)
escenario.fechaInicio=2026-01-01
escenario.horaInicio=00:00
# Duración real de la simulación de 5 días (30 a 60 min según el enunciado)
escenario.semanal.minutosReales=30
# Segundos simulados por segundo real en la simulación hasta el colapso
escenario.colapso.factor=600

# S13v1: operación día a día (menú "Tiempo real"). Arranca sola con el servidor y corre en paralelo al Simulador de
# rutas. Reloj = fecha y hora actual en esta zona horaria (K = 1), aunque el servidor esté configurado en otra (UTC).
# No lee los archivos de ventas: los pedidos se registran en línea y se guardan en datos/registrados/ventas.aaaamm.txt.
# Los bloqueos y el mantenimiento sí salen de los archivos de datos/, con la fecha real.
escenario.diario.zona=America/Lima
# Sa = Sc de la operación día a día, en minutos: planificación programada cada N minutos, alineada al reloj.
# Además, registrar un pedido o una avería lanza una replanificación inmediata. Se aplica al reabrir las operaciones.
escenario.diario.saMinutos=5

# Averías (v03, P&R pregunta 3). Solo se registran de forma manual desde el visualizador, en cualquier escenario.
# Tipo 1 (menor): no disponible N horas; se queda en el lugar con su carga y luego sigue.
averia.tipo1.horas=2
# Tipos 2 y 3: permanecen N horas en el lugar y luego pasan de forma instantánea al almacén central
# con los paquetes no trasvasados. Tipo 2: disponible al final del turno siguiente al de la avería.
averia.enLugar.horas=4
# Tipo 3 (mayor): disponible tras al menos N días, al inicio del turno de la hora indicada
averia.tipo3.diasMinimos=2
averia.tipo3.horaRetorno=15:00
# Trasvase: mientras una unidad con avería tipo 2 o 3 sigue en el lugar, otra puede recoger sus paquetes
averia.trasvase.habilitado=true
averia.trasvase.minutos=30

# Visualizador: cada cuántos ms se envía el estado a los navegadores
visualizador.publicacionMs=500
# v0.5: ventana de los paneles de almacenes: envíos que salen en las próximas N horas y entregados en las últimas N
panel.ventanaHoras=4

# v0.5: recarga. false = en cada recarga la unidad se llena hasta su capacidad (decisión del equipo, 31/10/2026:
# en las pruebas comparativas sale más barato y con menos vencidos); true = carga solo lo que entregará hasta su
# siguiente recarga (P&R pregunta 20, aún sin respuesta definitiva)
recarga.soloLoNecesario=false

# v0.5: duración del mantenimiento preventivo por tipo de unidad, en horas desde las 00:00 del día del plan.
# S13v1: 48 h para todos los tipos (respuesta del profesor a la P&R 19, 03/11/2026).
mantenimiento.horas.auto=48
mantenimiento.horas.moto=48
mantenimiento.horas.bici=48

# Semáforo de los indicadores (RNF d): rangos configurables
# % de pedidos a tiempo: verde >= 95, ámbar >= 85, rojo por debajo
semaforo.plazo.verde=95
semaforo.plazo.ambar=85
# Almacén intermedio, % de stock respecto de su capacidad: verde >= 30, ámbar >= 10, rojo por debajo
semaforo.almacen.verde=30
semaforo.almacen.ambar=10
# v0.5: regla de colores: el rojo siempre significa peligro; "vacío" (gris) cuando no hay nada.
# Almacén intermedio: verde = bastante stock, ámbar = poco, rojo = muy poco, vacío = 0 (claves semaforo.almacen.* arriba)
# Unidad de transporte, % de carga respecto de su capacidad: verde >= 50, ámbar >= 20, rojo por debajo, vacío = 0
semaforo.carga.verde=50
semaforo.carga.ambar=20
# Ocupación de la flota en servicio (indicador global): verde >= 50, ámbar >= 20, rojo por debajo, vacío = 0
semaforo.flota.verde=50
semaforo.flota.ambar=20
# Pedido: fracción del plazo que le queda (verde >= 0.5, ámbar >= 0.2, rojo por debajo o vencido)
semaforo.pedido.verde=0.5
semaforo.pedido.ambar=0.2
