# =====================================================================
# RUTAPAQ - Planificador de PaqRap (ALNS y GA)
# Parametros del experimento del IEN y de calibracion de los algoritmos.
# Ningun valor del caso esta codificado en el codigo fuente.
# =====================================================================

# --- Condiciones fijas del entorno (Tabla 2 del IEN) -----------------
ien.mapaAnchoKm                 = 70
ien.mapaAltoKm                  = 50
ien.almacenCentral              = 27,14
ien.almacenNorOeste             = 12,38
ien.almacenEste                 = 57,27
ien.capacidadIntermedio         = 1000
ien.autos                       = 10
ien.motos                       = 15
ien.bicicletas                  = 12
# Una entrega parcial por cada 24 productos (capacidad del auto); cada parte suma 1 h
ien.maximoProductosPorEntrega   = 24

# --- Parametros del experimento (Tabla 3 del IEN) --------------------
ien.horizonteHoras              = 48
ien.scMinutos                   = 60
ien.saSegundos                  = 30
planificador.presupuestoSegundos = 2.0
planificador.semilla            = 20260900

# --- Planificador (comun a ambos algoritmos) -------------------------
# Penalizacion por producto que queda sin planificar en una ejecucion;
# domina el costo por kilometro y fuerza a cubrir la cartera.
planificador.omegaNoPlanificado = 10000
planificador.candidatosInsercion = 8
planificador.vecinosGranulares  = 20
# Una ruta no se extiende mas alla de este horizonte desde el instante de planificacion
planificador.horizonteRutaHoras = 8
semaforo.verde                  = 0.95
semaforo.ambar                  = 0.85

# --- ALNS ------------------------------------------------------------
alns.factorT0                   = 0.05
alns.alfa                       = 0.95
alns.temperaturaMinima          = 0.001
alns.tamanoSegmento             = 100
alns.lambda                     = 0.80
alns.sigma1                     = 33
alns.sigma2                     = 20
alns.sigma3                     = 12
alns.qMin                       = 0.15
alns.qMax                       = 0.35
alns.kRegret                    = 3
alns.pDeterminismo              = 5
alns.penalizacionSinAlternativa = 1000000
alns.iteracionesSinMejora       = 4000
alns.shaw.phi1                  = 0.6
alns.shaw.phi2                  = 0.4
alns.shaw.horizonteHoras        = 36

# --- HGS / GA --------------------------------------------------------
# Poblacion pequena: con P = 2 s por ejecucion, una poblacion de 100
# individuos no alcanza a completar su generacion inicial.
hgs.tamanoPoblacion             = 25
hgs.lambdaOffspring             = 15
hgs.pc                          = 0.85
hgs.pm                          = 0.10
hgs.pEducacion                  = 1.0
hgs.genSinMejora                = 400
hgs.omegaSLA                    = 10000
hgs.omegaTurno                  = 10000
hgs.objetivoFactibles           = 0.20
hgs.periodoAjuste               = 50
hgs.nElite                      = 4
hgs.nCercanos                   = 5
hgs.loteParalelo                = 8
hgs.maxPasadasEducacion         = 8
# Cota de evaluaciones por educacion: mantiene el costo por descendiente acotado
# en las instancias grandes, donde una pasada completa consumiria todo el presupuesto
hgs.maxEvaluacionesEducacion    = 20000
hgs.maxParadasSplit             = 40
hgs.fraccionTiempoInicial       = 0.30
hgs.factorReparacion            = 10
